repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: scan-public
        name: personal-data scan (paths, emails, private IPs)
        entry: python scripts/scan_public.py
        language: system
        pass_filenames: true
